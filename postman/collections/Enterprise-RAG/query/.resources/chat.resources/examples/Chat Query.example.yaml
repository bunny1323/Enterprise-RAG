            "chunk_id": "8e3c0a08-0684-45da-ae32-cb9bb1b46d27::p4::s6",
            "content": "3. OPERATION FOR PERFORMANCE TESTS\nObserve the following rules in order to carry out performance tests accurately and safely.\nThe machine Repair any defects and damage found, such as oil or water leaks, loose bolts, cracks and so on, before starting to test.\nTest area\nSelect a hard, flat surface. Secure enough space to allow the machine to run straight more than 20 m , and to make a full swing with the front attachment extended. If required, rope off the test area and provide signboards to keep unauthorized personnel away.\nPrecautions\nBefore starting to test, agree upon the signals to be employed for communication among coworkers.   Once the test is started, be sure to communicate with each other using these signals, and to follow them without fail. Operate the machine carefully and always give first priority to safety. While testing, always take care to avoid accidents due to landslides or contact with high voltage power lines.   Always confirm that there is sufficient space for full swings. Avoid polluting the machine and the ground with leaking oil.   Use oil pans to catch escaping oil.   Pay special attention to this when removing hydraulic pipings.\nMake precise measurements\nAccurately calibrate test instruments in advance to obtain correct data. Carry out tests under the exact test conditions prescribed for each test item. Repeat the same test and confirm that the test data obtained can be procured repeatedly.      Use mean values of measurements if necessary.\n1)\n(1)\n(2)\n① ②\n③\n(3)\n(4)\n①\n②\n③\n④\n①\n②\n③\n(210-7)  7-3",
