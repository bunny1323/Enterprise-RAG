            "content": "SECTION  7  MAINTENANCE STANDARD GROUP  1  OPERATIONAL PERFORMANCE TEST\n1. PURPOSE Performance tests are used to check:\nOPERATIONAL PERFORMANCE OF A NEW MACHINE Whenever a new machine is delivered in parts and reassembled at a customer's site, it must be tested to confirm that the operational performance of the machine meets Hyundai spec.\nOPERATIONAL PERFORMANCE OF A WORKING MACHINE With the passage of time, the machine's operational performance deteriorates, so that the machine needs to be serviced periodically to restore it to its original performance level. Before servicing the machine, conduct performance tests to check the extent of deterioration, and to decide what kind of service needs to be done(by referring to the \"Service Limits\" in this manual).\nOPERATIONAL PERFORMANCE OF A REPAIRED MACHINE After the machine is repaired or serviced, it must be tested to confirm that its operational performance was restored by the repair and/or service work done.\nWorking condition\nOperating\nMaintenance      record\n1)\n2)\n3)\n21077MS01",
