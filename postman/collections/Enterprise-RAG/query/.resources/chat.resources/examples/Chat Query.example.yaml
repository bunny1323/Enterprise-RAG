            "content": "7-4\nENGINE SPEED\nMeasure the engine speed at each power mode The engine speed at each power mode must meet standard RPM; if not, all other operational performance data will be unreliable.   It is essential to perform this test first.\nPreparation\nWarm up the machine, until the engine coolant temperature reaches 50 。 C or more, and the hydraulic oil is 50 ± 5 。 C. Set the accel dial at 10(Max) position. Push the H-mode switch and confirm that the fuel injection pump governor lever comes into contact with the high-idle stopper. Measure the engine RPM.\nMeasurement\nStart the engine.   The engine will run at start idle speed.   Measure engine speed with a tachometer. Measure and record the engine speed at each mode(H, S). Select the H-mode. Lightly operate the bucket control lever a few times, then return the control lever to neutral; The engine will automatically enter   the   auto-idle speed after 4 seconds. Measure and record the auto deceleration speed.\n2)\n(1)\n※\n(2)\n(3)\n①\n②\n③ ④\n⑤\n①\n② ③\n④\nEvaluation The measured speeds should meet the following specifications. (4)\nModel\nR21 5L\nEngine speed\nStart idle\nH mode\nS mode\nAuto decel\nStandard\n1000 ± 100\n2050 ± 50\n1750 ± 50\n1200 ± 100\nRemarks\nUnit :  rpm\nCondition : Set the accel dial at 10(Max) position.",
