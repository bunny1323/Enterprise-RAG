        "answer": "Performance tests are used to check the operational performance of a new machine (to confirm it meets Hyundai spec after reassembly), a working machine (to check the extent of deterioration before servicing), and a repaired machine (to confirm performance was restored after repair or service).\n\nFor the engine speed in H mode, the technician must:\n1.  **Prepare:** Warm up the machine until the engine coolant temperature reaches 50°C or more and the hydraulic oil is 50 ± 5°C. Set the accel dial at the 10 (Max) position. Push the H-mode switch and confirm that the fuel injection pump governor lever comes into contact with the high-idle stopper.\n2.  **Measure:** Select the H-mode and measure the engine speed with a tachometer.\n3.  **Evaluate:** The measured speed must meet the standard of 2050 ± 50 rpm.",
