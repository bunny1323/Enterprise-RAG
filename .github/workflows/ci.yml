name: Enterprise-RAG CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

# ── Job 1: Backend lint, type-check, and unit tests ──────────────────────────
jobs:
  backend-ci:
    name: "Backend — Lint, Type-check & Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # ── Minimal stub values so Settings() can construct in CI ────────────────
      # No real secrets; integration tests are skipped via the 'integration' mark.
      APP_ENV: "test"
      API_KEY_AUTH_ENABLED: "false"
      DATABASE_URL: "postgresql://ci_user:ci_pass@localhost:5432/ci_db"
      WEAVIATE_URL: "https://ci-stub.weaviate.network"
      WEAVIATE_API_KEY: "ci-weaviate-key"
      NEO4J_PASSWORD: "ci-neo4j-password"
      NEO4J_URI: "bolt://localhost:7687"
      GROQ_API_KEY: ""
      REDIS_URL: ""
      LLM_PROVIDER: "groq"
      LLM_MODEL: "llama-3.3-70b-versatile"
      EMBEDDING_PROVIDER: "local"
      VISION_PROVIDER: "disabled"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (core + dev)
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Type-check with mypy (non-strict, CI mode)
        run: mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true   # warnings do not block merge; errors are flagged

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -m "not integration and not slow" \
            --timeout=60
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ── Job 2: Frontend type-check and build ─────────────────────────────────────
  frontend-ci:
    name: "Frontend — Type-check & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: "https://enterprise-rag-2u7l.onrender.com"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ── Job 3: Security smoke tests (no external services) ───────────────────────
  security-smoke:
    name: "Security — Smoke Tests"
    runs-on: ubuntu-latest
    needs: backend-ci
    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: "test"
      API_KEY_AUTH_ENABLED: "false"
      DATABASE_URL: "postgresql://ci_user:ci_pass@localhost:5432/ci_db"
      WEAVIATE_URL: "https://ci-stub.weaviate.network"
      WEAVIATE_API_KEY: "ci-weaviate-key"
      NEO4J_PASSWORD: "ci-neo4j-password"
      GROQ_API_KEY: ""
      REDIS_URL: ""
      LLM_MODEL: "llama-3.3-70b-versatile"
      VISION_PROVIDER: "disabled"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run security audit tests
        run: |
          pytest tests/unit/test_security_audit.py \
            -v \
            --tb=long \
            --timeout=30

  # ── Job 4: Dependency vulnerability scan ──────────────────────────────────────
  dependency-audit:
    name: "Dependency — Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          pip install -e "backend/.[dev]" --quiet 2>/dev/null || true
          pip-audit --desc --output json --output-file audit-python.json || true
          pip-audit --desc || true

      - name: Upload Python audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-audit
          path: audit-python.json
          retention-days: 14

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit Node.js dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || true

  # ── Job 5: Final gate — all required jobs must pass ───────────────────────────
  ci-gate:
    name: "CI Gate"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, security-smoke]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ needs.backend-ci.result }}" != "success" ]]; then
            echo "::error::Backend CI failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-ci.result }}" != "success" ]]; then
            echo "::error::Frontend CI failed"
            exit 1
          fi
          if [[ "${{ needs.security-smoke.result }}" != "success" ]]; then
            echo "::error::Security smoke tests failed"
            exit 1
          fi
          echo "All required CI jobs passed ✓"
