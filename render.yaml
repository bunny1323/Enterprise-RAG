services:
  - type: web
    name: enterprise-rag-2u7l
    runtime: docker
    plan: standard
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    disk:
      name: enterprise-rag-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_KEY_AUTH_ENABLED
        value: "false"
      - key: OPA_ENABLED
        value: "false"
      - key: OPA_URL
        sync: false
      - key: OPA_AUTH_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEAVIATE_URL
        sync: false
      - key: WEAVIATE_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_PROVIDER
        value: local
      - key: LOCAL_EMBEDDING_DEVICE
        value: cpu
      - key: VISION_PROVIDER
        value: disabled
      - key: CORS_ORIGINS
        value: https://enterprise-rag-ui.onrender.com
      - key: RAW_STORAGE_PATH
        value: /data/raw
      - key: PROCESSED_STORAGE_PATH
        value: /data/processed
      - key: CHUNKS_STORAGE_PATH
        value: /data/chunks
      - key: VISION_CACHE_DIR
        value: /data/processed/vision_cache
      - key: HF_HOME
        value: /data/model-cache

  - type: web
    name: enterprise-rag-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://enterprise-rag-2u7l.onrender.com
